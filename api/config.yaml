# 后端配置（可入库）。敏感项与机器相关路径写在仓库根目录 .env。
# ${VAR} 由 API 启动时展开（自动加载 api/ 上级或同目录的 .env）。

panel:
  listen: ":8080"
  jwt_secret: "${PANEL_JWT_SECRET}"
  admin_username: "${PANEL_ADMIN_USERNAME}"
  admin_password: "${PANEL_ADMIN_PASSWORD}"

targets:
  - id: "${TARGET_ID}"
    name: "${TARGET_NAME}"
    docker:
      enabled: ${DOCKER_ENABLED}
      host: "unix:///var/run/docker.sock"
      network: "${AC_NETWORK}"
      containers:
        worldserver: "ac-worldserver"
        authserver: "ac-authserver"
        database: "ac-database"
    soap:
      host: "${SOAP_HOST}"
      port: ${SOAP_PORT}
      username: "${SOAP_USERNAME}"
      password: "${SOAP_PASSWORD}"
    mysql:
      host: "${MYSQL_HOST}"
      port: ${MYSQL_PORT}
      user: "${MYSQL_USER}"
      password: "${MYSQL_PASSWORD}"
      auth_db: "${MYSQL_AUTH_DB}"
      characters_db: "${MYSQL_CHARACTERS_DB}"
      world_db: "${MYSQL_WORLD_DB}"
      playerbots_db: "${MYSQL_PLAYERBOTS_DB}"
    conf:
      etc_dir: "${AC_ROOT}/docker/vol/etc"
      playerbots_conf: "${AC_ROOT}/docker/vol/etc/modules/playerbots.conf"
      worldserver_conf: "${AC_ROOT}/docker/vol/etc/worldserver.conf"
      authserver_conf: "${AC_ROOT}/docker/vol/etc/authserver.conf"
    modules:
      enabled: true
      deploy: "${MODULES_DEPLOY}"
      modules_dir: "${AC_ROOT}/modules"
      modules_list: "${AC_ROOT}/conf/modules.list"
      etc_modules_dir: "${AC_ROOT}/docker/vol/etc/modules"
      compose_dir: "${AC_ROOT}"
      world_service: ac-worldserver
      # 保底：SOAP / git 都拿不到本机版本时使用（可只填 revision 短哈希）
      core_version: "${AC_CORE_VERSION}"
      core_revision: "${AC_CORE_REVISION}"
      allow_owners:
        - azerothcore
      checkpoint_keep: 5
      build_timeout_minutes: 45
    backup:
      dir: "../data/backups"
      mysqldump_path: "mysqldump"
    bots:
      account_prefix: "${BOT_ACCOUNT_PREFIX}"

soap:
  timeout_seconds: 10
  allow:
    - "server info"
    - "server debug"
    - "server motd"
    - "server set motd"
    - "server restart"
    - "server restart cancel"
    - "server shutdown"
    - "server shutdown cancel"
    - "server idlerestart"
    - "server idleshutdown"
    - "server set closed"
    - "server set security"
    - "announce"
    - "notify"
    - "account create"
    - "account set password"
    - "account set gmlevel"
    - "account set addon"
    - "account lock"
    - "account flag"
    - "account delete"
    - "account set 2fa"
    - "kick"
    - "teleport name"
    - "tele name"
    - "teleport del"
    - "unstuck"
    - "character level"
    - "character rename"
    - "character customize"
    - "character changefaction"
    - "character changerace"
    - "character changeaccount"
    - "character deleted"
    - "character titles"
    - "ban"
    - "unban"
    - "mute"
    - "unmute"
    - "freeze"
    - "unfreeze"
    - "revive"
    - "reset"
    - "quest"
    - "send mail"
    - "send items"
    - "send money"
    - "additem"
    - "ticket"
    - "guild"
    - "arena"
    - "event"
    - "disable"
    - "reload"
    - "playerbot rndbot stats"
    - "playerbot rndbot reload"
    - "playerbot rndbot init"
    - "playerbot rndbot reset"
    - "playerbot rndbot level"
    - "playerbot rndbot refresh"
    - "playerbot rndbot teleport"
    - "playerbot pmon"
    - "playerbots bot"
    - "playerbots account"

soap_deny:
  - "playerbot rndbot revive"
  - "playerbot rndbot grind"
  - "server exit"

deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "${DEEPSEEK_BASE_URL}"
  model: "${DEEPSEEK_MODEL}"

github:
  token: "${GITHUB_TOKEN}"

modules_global:
  registry_path: "../data/module-registry.json"
  cache_dir: "../data/module-cache"
  curated_path: "data/modules/curated.json"
  # 本地从 api/ 启动 → ../data；容器 WORKDIR=/app → /data（compose 已挂 ./data:/data）
  checkpoint_dir: "../data/module-checkpoints"
