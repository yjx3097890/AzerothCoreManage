services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: acmanage-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./api/config.yaml:/etc/acmanage/config.yaml:ro
      - ./.env:/etc/acmanage/.env:ro
      - ./data:/data
      - ./logs:/app/logs
      # 精选模块 JSON（可热改，无需重建镜像）
      - ./api/data/modules:/app/data/modules:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # 路径来自 .env 的 AC_ROOT，与 api/config.yaml conf.* / modules.* 一致
      # 须与游戏服在同一台宿主机，且 AC_ROOT 指向真实源码树
      - ${AC_ROOT}/docker/vol/etc:${AC_ROOT}/docker/vol/etc
      - ${AC_ROOT}/conf:${AC_ROOT}/conf
      - ${AC_ROOT}/modules:${AC_ROOT}/modules
    networks:
      - acmanage
      - acore

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: acmanage-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ACMANAGE_WEB_PORT:-8086}:80"
    networks:
      - acmanage

networks:
  acmanage:
    driver: bridge
  # 名称来自 .env 的 AC_NETWORK（须与游戏服 compose 网络一致）
  acore:
    name: ${AC_NETWORK:-azerothcore-wotlk_ac-network}
    external: true
