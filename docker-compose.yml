services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: acmanage-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./api/config.yaml:/etc/acmanage/config.yaml:ro
      - ./.env:/etc/acmanage/.env:ro
      - ./data:/data
      - ./logs:/app/logs
      # 精选模块 JSON（可热改，无需重建镜像）
      - ./api/data/modules:/app/data/modules:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # 整棵 AC 源码树（须与游戏服同机）。覆盖：
      #   docker/vol/etc  — worldserver/authserver + etc/modules（含 playerbots.conf）
      #   conf/           — modules.list
      #   modules/        — 已安装模块源码
      #   根目录          — docker-compose.override.yml、核心 git 探测
      - ${AC_ROOT}:${AC_ROOT}
    networks:
      - acmanage
      - acore

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: acmanage-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ACMANAGE_WEB_PORT:-8086}:80"
    networks:
      - acmanage

networks:
  acmanage:
    driver: bridge
  # 名称来自 .env 的 AC_NETWORK（须与游戏服 compose 网络一致）
  acore:
    name: ${AC_NETWORK:-azerothcore-wotlk_ac-network}
    external: true
